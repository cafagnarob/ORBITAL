# Pubblica ORBITAL su GitHub Pages a ogni push su main:
# installa, lancia i test, fa la build e pubblica la cartella dist/.
# Se un test fallisce, il sito online resta quello di prima.
name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permette anche di avviarlo a mano da Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pubblicazione.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: pubblicazione
        uses: actions/deploy-pages@v4
